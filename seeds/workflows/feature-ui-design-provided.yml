# forge v2 — `feature-ui-design-provided` workflow translated to YAML
# Source: src/workflows/feature-ui-design-provided.ts

name: feature-ui-design-provided
description: Feature work with UI design already in hand. Architect → plan → build → verify.

# Model rationale: only architect uses spec-writer (Opus). plan / build / verify
# use default (Sonnet) — translating architecture to a plan, implementing
# against acceptance criteria, and judging tests are well within Sonnet's
# capability. Reds stay on fast-orchestrator (Haiku) for triage.

inputs:
  - name: prd
    required: true
    type: path
    help: "Absolute path to the PRD / design doc / spec file."

steps:
  - id: architect
    agent: architecture-advisor
    model: spec-writer
    gate: human
    workflow_additions: |
      Produce systems-level architectural assessment grounded in the provided UI
      design (inputs.prd or upstream design artifacts). Read the HTML files / PNGs
      if present. Output {risks, constraints, boundaries, priorArt, openQuestions,
      notes} — NOT implementation guidance (no type names, no function names).
      See architect seed.
    reds:
      - agent: red-wide
        model: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      - agent: red-narrow
        model: fast-orchestrator
        authority: specialist
        gate_on_verdict: false

  - id: plan
    agent: tech-lead
    model: default
    depends_on: [architect]
    gate: human
    workflow_additions: |
      Translate the architecture document into a step-by-step plan.
      Output {steps: [{id, summary, files, acceptance}]}.

  # ----- build -----
  # Fanout: one child task per plan-step, agent routed by step.discipline.
  # Reds stay on the parent — they review the aggregate diff once all children
  # settle (per-parent dispatch, not per-child). See #139 for the design call.
  - id: build
    agent: engineer                    # fallback for steps with discipline=general or unmapped
    model: default
    depends_on: [plan]
    gate: verdict     # any authoritative red's fail blocks; human can force-advance with rationale
    workflow_additions: |
      Implement your assigned plan-step (passed via inputs.step). Output {step_completed, diff_summary, files_modified}.
      The tech-lead asserts your step's files are independent of every other step's files in this build; do not touch files outside your step.files list.
    fanout:
      from_upstream:
        step: plan
        array_key: steps
        input_key: step
      agent_map:
        frontend: frontend-specialist
        backend: backend-specialist
        infosec: security-advisor
        platform: agentic-platform-builder
      max_concurrency: 4
      failure_mode: fail-phase
    reds:
      - agent: red-wide
        model: fast-orchestrator
        authority: authoritative
        gate_on_verdict: true
      - agent: red-narrow
        model: fast-orchestrator
        authority: authoritative
        gate_on_verdict: true
      - agent: red-frontend
        model: fast-orchestrator
        authority: authoritative
        gate_on_verdict: true
      - agent: red-backend
        model: fast-orchestrator
        authority: authoritative
        gate_on_verdict: true
      - agent: red-security
        model: fast-orchestrator
        authority: authoritative
        gate_on_verdict: true

  - id: verify
    agent: test-engineer
    model: default
    depends_on: [build]
    gate: human
    workflow_additions: |
      Write integration and E2E tests for the build. Read the upstream engineer's
      result to understand what changed, then write tests that exercise those
      changes through real user flows and component interactions.
      Output {test_files_written, tests_written, tests_run, tests_passed, tests_failed,
      coverage_summary}.
