# forge v2 — `feature` workflow translated to YAML
#
# Source of truth: src/workflows/feature.ts (the TypeScript Workflow object).
# This draft is the proposed YAML shape for that same workflow under #116.
# When v2 lands, this becomes ~/.forge/workflows/feature.yml.
#
# Schema decisions locked 2026-05-13 (paired session, no individual call):
#   - Per-project override: <project>/.forge/workflows/<name>.yml (matches workspace structure)
#   - Reds-block shape: list of dicts (most explicit, most extensible)
#   - Gate field: step-level `gate: human|verdict|none` (reads where the decision lives)
#   - DAG schema today, linear-or-wave runner now (#116 plan: walk topologically with parallel
#     within wave; today's reds-as-parallel-children is also expressed as DAG implicitly)

name: feature
description: Feature work without UI/UX design. Architect → plan → build → verify → docs.

# FG-640 — THE CUTOVER. `feature` is migrated to the evidence-led review lifecycle. This one
# line is the whole switch: it is stamped onto every run this workflow starts (startRun.ts),
# and from there the `build` gate is settled by the review ledger (`review_disposition`)
# rather than by verdict aggregation. Nothing about which command the operator typed changes
# the authority model — deleting this line puts `feature` back on the legacy gate, and every
# workflow that omits it (investigation, research, campaign, …) keeps verdict/blocked_by_red
# exactly as before.
#
# Two consequences, both deliberate:
#   - build's six reds are ADVISORY (authority: specialist, gate_on_verdict: false). Their
#     findings enter the ledger and are settled there; a raw `fail` no longer blocks on its own.
#   - the reds below are the MENU, not the panel. The plan step's approved `review_contract`
#     selects which risk lenses actually run (selectRedsForContract) — a feature that declares
#     backend + security does not spend a frontend reviewer. With no approved contract, every
#     declared red runs: fail closed is WIDER here.
review_mode: evidence_led

# Model rationale: only architect uses spec-writer (Opus). plan / build / verify
# use default (Sonnet) — translating architecture to a plan, implementing
# against acceptance criteria, and judging tests are well within Sonnet's
# capability. Build fans out, so Opus burn there was the bulk of cost without
# a quality justification. Reds stay on fast-orchestrator (Haiku) for triage.

# What inputs `forge new` must collect for this workflow.
# Maps to today's CLI flags: --brief here, --question for investigation, --prd for
# feature-ui-design-provided, etc. Runner validates required fields are present.
inputs:
  - name: brief
    required: true
    type: text
    help: "What you want built, in your own words."

steps:
  # ----- architect -----
  - id: architect
    agent: architecture-advisor
    activity: spec-writer
    gate: human
    workflow_additions: |
      Produce systems-level architectural assessment, NOT implementation guidance.
      Output {risks, constraints, boundaries, priorArt, openQuestions, notes}.
      Empty arrays are fine when a feature genuinely has no concerns at that level.
      Do not pick type names, function names, or file paths — that's the implementer's
      job with the code in front of them. See architect seed for the discipline.
    reds:
      - agent: red-wide
        activity: fast-orchestrator
        # Informational: a verdict this red AUTHORS doesn't block the gate on its
        # own, fail included. A red that returns NO review (crash, idle timeout,
        # OOM, unreadable result, model error) blocks regardless of authority —
        # forge synthesized that inconclusive, so the panel is incomplete.
        authority: specialist
        gate_on_verdict: false
      - agent: red-narrow
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false

  # ----- plan -----
  - id: plan
    agent: tech-lead
    activity: default
    depends_on: [architect]
    gate: human
    workflow_additions: |
      Translate the architecture document into a step-by-step plan.
      Output {steps: [{id, summary, files, depends_on, acceptance}], review_contract}.

      depends_on is EXECUTABLE CONTROLLER DATA, not advisory prose (FG-584). It lists the ids of
      the steps this step's work is built on. Forge dispatches a step only once every id in its
      depends_on has been built, integrated into the run's candidate and proven to build there,
      and then cuts that step's workspace from that candidate — so it can import what its
      prerequisites created. Steps with no path between them still run concurrently.

      A semantic dependency is a dependency whatever the file layout: if a step imports a module,
      calls a function or tests behavior another step adds, declare the edge EVEN IF their files
      lists are disjoint. Ordered steps MAY share a path (order them, don't merge them);
      concurrently-runnable steps may not. An unknown id, a self-dependency, a cycle, a duplicate
      id, or a same-path overlap between concurrently-runnable steps is REFUSED before any build
      container starts, and the plan comes back here.

      review_contract is the risk surface this change must be reviewed against, and the
      human gate on THIS step is what approves it (FG-640). Shape:
        {threat_model, protected_invariants: [], acceptance_refs: [], non_goals: [],
         risk_lenses: [one or more of wide, narrow, frontend, backend, security]}
      Select the lenses the change's actual risk surface needs — a backend-only change does
      not need a frontend reviewer. Only the selected lenses are dispatched at build. You may
      not narrow it later: the coordinator can ADD a lens with recorded diff evidence, but
      removing one or changing the threat model returns here, to the approving authority.

  # ----- build -----
  # Fanout: one child task per plan-step, agent routed by step.discipline.
  # Reds stay on the parent — they review the aggregate diff once all children
  # settle (per-parent dispatch, not per-child). See #139 for the design call.
  - id: build
    agent: engineer                    # fallback for steps with discipline=general or unmapped
    activity: default
    depends_on: [plan]
    # gate: verdict is the POSITION the review_disposition gate occupies under
    # review_mode: evidence_led — the step still parks at awaiting_gate (no new task status,
    # FG-585), but what settles it is the ledger, not verdict aggregation. --force + rationale
    # is still the human override; it is not the ordinary settlement path.
    gate: verdict
    workflow_additions: |
      Implement your assigned plan-step (passed via inputs.step). Output {step_completed, diff_summary, files_modified}.
      Do not touch files outside your step.files list.
      Your workspace already contains the output of every step yours declares in depends_on — Forge
      integrated each of them into the run's candidate and proved it builds before cutting your
      workspace from it. It may also contain other steps that were prerequisites of something and
      were integrated ahead of yours. It NEVER contains a step that is still running, and never
      contains a step nothing depends on. So: do not assume the work of a step you do not depend on
      exists. If you find you need something from a step you do not depend on, say so in notes rather
      than reimplementing it: the missing edge is a plan defect.
    fanout:
      from_upstream:
        step: plan
        array_key: steps
        input_key: step
      agent_map:
        frontend: frontend-specialist
        backend: backend-specialist
        infosec: security-advisor
        platform: agentic-platform-builder
      max_concurrency: 4
      failure_mode: fail-phase
    # FG-640: all six migrated to advisory. A verdict here is EVIDENCE — it becomes ledger
    # findings that must each be dispositioned — and no longer authority. Combining the two
    # models in one run is refused by name (mixed_authority_model), so these must not go back
    # to authoritative while `review_mode: evidence_led` stands above.
    reds:
      - agent: red-wide
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      - agent: red-narrow
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      - agent: red-frontend
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      - agent: red-backend
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      - agent: red-security
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false
      # Not a risk lens, so never lens-selected away: the shipping reviewer's six duties are
      # about the review as a whole, not about one slice of the diff.
      - agent: shipping-reviewer
        activity: fast-orchestrator
        authority: specialist
        gate_on_verdict: false

  # ----- verify -----
  - id: verify
    agent: test-engineer
    activity: default
    depends_on: [build]
    gate: human
    workflow_additions: |
      Write integration and E2E tests for the build. Read the upstream engineer's
      result to understand what changed, then write tests that exercise those
      changes through real user flows and component interactions.
      Output {test_files_written, tests_written, tests_run, tests_passed, tests_failed,
      coverage_summary}.

  # ----- docs -----
  # Docs is a guaranteed phase (#257), not an orchestrator afterthought. Forge's
  # docs-impact assessment (src/v2/docs-impact.ts) is advisory-only — it warns,
  # it never blocks — so feature runs silently shipped without doc updates. A
  # phase the documentation-maintainer runs every time can't be skipped. gate:
  # auto so the orchestrator reviews the contract and advances without a human stop.
  - id: docs
    agent: documentation-maintainer
    activity: default
    depends_on: [verify]
    gate: auto
    workflow_additions: |
      Reconcile operator-facing documentation with what this run built. Read the
      upstream build and verify results to see what changed, establish ground
      truth from the project tree, then find the affected docs by content and edit
      them to match. If nothing operator-visible changed, say so explicitly via
      docs_not_updated_reason rather than leaving the field empty.
      Output {docs_updated, docs_not_updated_reason, stale_docs_found,
      operator_behavior_changed}.
