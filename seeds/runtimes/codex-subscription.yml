# forge v2 — codex-subscription runtime (AWN-7 Walk)
#
# Codex (OpenAI) via ChatGPT subscription. The container runs the `codex` CLI in
# `exec --json` mode. Auth is the host's ChatGPT-subscription credential
# (~/.codex/auth.json): forge RO-mounts ONLY that file (auth.mode: codex-auth),
# and agent-entrypoint.sh copies it into a writable CODEX_HOME so in-container
# token refresh works and dies with the container.
#
# Decision: Codex runs as a container CLI, NOT the OpenAI API direct — the
# containerized runtime owns the agent loop. See
# learnings/decisions/2026-05-30_provider-resolution.md §7.
#
# Installed at ~/.forge/runtimes/codex-subscription.yml by install-seeds.sh.

name: codex-subscription
description: |
  Codex (OpenAI) via ChatGPT subscription. Second provider proof for AWN-7 Walk.

# #292: runtime EXECUTION metadata — declared explicitly so usage parsing keys off
# log_format (codex-jsonl), NOT the upstream provider name. This is the seam that
# lets a third runtime (Pi) be added without an "if provider == ..." branch.
runtime_kind: codex
log_format: codex-jsonl              # `codex exec --json` emits JSONL events
prompt_strategy: stdin-prepend       # no system-prompt flag; prompt prepended to stdin
auth_strategy: codex-auth            # RO-mount ~/.codex/auth.json → CODEX_HOME

detect:
  # No auto-detection clause — codex-subscription is selected by policy
  # (an openai/subscription profile), never auto-detected from env.
  env: []
  files: []

image: agent-dev-worker:latest

models:
  # Only consulted in LEGACY mode (no model-policy.yml); in policy mode the
  # concrete model comes from the profile's capability map. Default mirrors the
  # operator's configured codex model (`~/.codex/config.toml`).
  default: gpt-5.5

auth:
  mode: codex-auth   # RO-mount ~/.codex/auth.json; entrypoint copies to CODEX_HOME

env: {}

mounts:
  - host: "${TASK_DIR}"
    container: /task
    mode: rw

  - host: "${PROJECT_DIR}"
    container: /project
    mode: "${PROJECT_MODE:-rw}"      # 'ro' for red agents; runner sets per-step

  - host: "${DESIGN_DIR}"
    container: /design
    mode: ro
    optional: true
  # No browser-tools skill mount: that's a claude-skills capability codex doesn't
  # consume. Revisit if codex grows an equivalent.

invocation:
  command: codex
  args:
    - exec
    - --json                                       # JSONL events on stdout (usage parser reads these)
    - --dangerously-bypass-approvals-and-sandbox   # forge container IS the sandbox; codex's own sandbox would block writing /task/result.json + editing /project (RO project mount still enforces reds at the OS layer). Mirrors claude --dangerously-skip-permissions.
    - --skip-git-repo-check                        # /project isn't guaranteed to be a git repo
    - -m
    - "${MODEL}"
    - --cd
    - /project
    - "-"                                          # read the prompt from stdin
  # Verified against codex-cli 0.135.0: `codex exec` has NO system-prompt flag
  # (no --append-system-prompt equivalent), so the composed system prompt is
  # prepended to the task package in the single stdin stream. The system prompt
  # carries the result.json contract the agent must honor.
  stdin: |
    ${SYSTEM_PROMPT}

    ---

    ${TASK_PACKAGE_MARKDOWN}

container:
  name: "forge-${TASK_ID}"
  remove_on_exit: true
  idle_timeout_seconds: 600

result:
  file: /task/result.json
  stdout_log: container.stdout.log
  stderr_log: container.stderr.log
