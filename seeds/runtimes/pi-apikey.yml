# forge v2 — pi-apikey runtime (#258 Crawl / #261)
#
# pi (pi.dev) coding agent via a provider API key passed as an env var. The
# container runs the `pi` CLI in `-p --mode json` (non-interactive, JSONL events
# on stdout). Crawl proof for the third agent runtime — selected EXPLICITLY with
# `forge invoke --runtime pi-apikey`; it is NOT auto-detected and NOT yet in the
# model-policy provider binding (that's #265).
#
# Scope note (#261): this Crawl runtime was anthropic-bound for the proof —
# auth.mode: apikey injects the upstream provider's API key and the invocation
# pins `--provider anthropic` (or the resolved provider via #265). OAuth
# (~/.pi/agent/auth.json) is #266; local models are #268.
#
# Installed at ~/.forge/runtimes/pi-apikey.yml by install-seeds.sh.

name: pi-apikey
description: |
  pi (pi.dev) via a provider API key (env var). Third agent runtime, Crawl proof.
  Run with: forge invoke --runtime pi-apikey.

# #292 runtime EXECUTION metadata — declared explicitly so usage parsing and
# prompt handling key off these, not the provider name. log_format: pi-jsonl
# selects pi's usage parser (#262), independent of the upstream provider.
# prompt_strategy: message-arg — system prompt via --append-system-prompt, task
# package via pi's `@file` message syntax referencing /task/package.md (the
# injection mapping itself is #263; FG-497 moved the package off argv).
runtime_kind: pi
log_format: pi-jsonl
prompt_strategy: message-arg
auth_strategy: env-provider-api-key

detect:
  # Not auto-detected — selected only via `forge invoke --runtime pi-apikey`.
  env: []
  files: []

image: agent-dev-worker:latest

models:
  # Only consulted in legacy mode (no model-policy.yml). Concrete model id handed
  # to pi as ${MODEL}; provider is pinned in the invocation below.
  default: claude-sonnet-4-6

auth:
  mode: apikey   # injects the resolved upstream provider's API key as -e
  # (ANTHROPIC_API_KEY when upstream is anthropic/default, GROQ_API_KEY when
  # provider: groq, etc.). No mount, no volume. Spawn-time fresh.

env:
  # pi needs no headless browser; skip the entrypoint's Chromium startup.
  FORGE_NO_BROWSER: "1"

mounts:
  - host: "${TASK_DIR}"
    container: /task
    mode: rw

  - host: "${PROJECT_DIR}"
    container: /project
    mode: "${PROJECT_MODE:-rw}"      # 'ro' for red agents; runner sets per-step

  - host: "${DESIGN_DIR}"
    container: /design
    mode: ro
    optional: true
  # No browser-tools skill mount: not a pi capability in Crawl.

invocation:
  command: pi
  args:
    - -p                              # --print: non-interactive, process prompt and exit
    - --mode
    - json                            # JSONL events on stdout (parsed by the pi usage parser, #262)
    - --no-context-files              # don't auto-load /project AGENTS.md/CLAUDE.md
    - --no-session                    # ephemeral; don't persist a session file
    - --provider
    # #265: upstream vendor resolved by model-policy (groq/anthropic/ollama),
    # threaded as ${UPSTREAM_PROVIDER}. Legacy `forge invoke --runtime pi-apikey`
    # (no policy) leaves it empty → the :-anthropic fallback keeps the Crawl
    # anthropic binding. Cross-provider API-key injection wired in spawn.ts (#303).
    - "${UPSTREAM_PROVIDER:-anthropic}"
    - --model
    - "${MODEL}"
    - --append-system-prompt
    - "${SYSTEM_PROMPT}"
    # FG-497: reference the task package FILE (already written to /task/package.md
    # by invoke.ts, unbounded) via pi's `@file` message syntax, instead of
    # embedding ${TASK_PACKAGE_MARKDOWN} verbatim as a positional argv string —
    # that breached Linux's MAX_ARG_STRLEN (131072 bytes) on large packets
    # (e.g. a review-loop reviewer packet), the same defect fixed for the
    # system prompt above.
    - "@/task/package.md"
  # No `stdin:` — pi reads the prompt from args (message-arg), unlike claude/codex.

container:
  name: "forge-${TASK_ID}"
  remove_on_exit: true
  idle_timeout_seconds: 600

result:
  file: /task/result.json
  stdout_log: container.stdout.log
  stderr_log: container.stderr.log
