# forge v2 — claude-oauth + headroom proxy runtime (example)
#
# Identical to claude-oauth.yml except compression_mode: proxy.
# Use this runtime for agents that don't support the headroom MCP tool
# but should still benefit from transparent API-level compression.
#
# How it works:
#   - spawn.ts sets FORGE_HEADROOM_PROXY=1, ANTHROPIC_BASE_URL=http://localhost:8787
#   - agent-entrypoint.sh starts `headroom proxy --port 8787` as a background sidecar
#   - All outbound Claude API calls pass through the proxy, which compresses
#     context transparently (no agent-side changes required)
#   - The sidecar is killed when the container exits
#
# When to use:
#   - compression_mode: mcp  (default) — agent uses headroom MCP tools explicitly
#   - compression_mode: proxy           — transparent proxy for non-compliant agents
#   - compression_mode: none            — skip all compression

name: claude-oauth-proxy
description: |
  Claude via Anthropic OAuth with headroom proxy-mode compression.
  For agents that don't support the headroom MCP tool.

runtime_kind: claude-code
log_format: claude-stream-json
prompt_strategy: claude-stdin-package
auth_strategy: oauth-volume

compression_mode: proxy

detect:
  env: []
  files: []

image: agent-dev-worker:latest

models:
  spec-writer: claude-opus-4-8
  fast-orchestrator: claude-haiku-4-5
  default: claude-sonnet-4-6

auth:
  mode: oauth-volume

env: {}

mounts:
  - host: "${TASK_DIR}"
    container: /task
    mode: rw

  - host: "${PROJECT_DIR}"
    container: /project
    mode: "${PROJECT_MODE:-rw}"

  - host: "${DESIGN_DIR}"
    container: /design
    mode: ro
    optional: true

  - host: "${FORGE_BROWSER_TOOLS_DIR:-~/pi-skills/browser-tools}"
    container: /home/agent/.claude/skills/browser-tools
    mode: ro
    optional: true

invocation:
  command: claude
  args:
    - --model
    - "${MODEL}"
    - --append-system-prompt
    - "${SYSTEM_PROMPT}"
    - --dangerously-skip-permissions
    - --output-format
    - stream-json
    - --verbose
    - --include-partial-messages
    - --print
  stdin: "${TASK_PACKAGE_MARKDOWN}"

container:
  name: "forge-${TASK_ID}"
  remove_on_exit: true
  idle_timeout_seconds: 600

result:
  file: /task/result.json
  stdout_log: container.stdout.log
  stderr_log: container.stderr.log
