# forge v2 — claude-oauth runtime
#
# Claude via Anthropic OAuth (Claude Pro / Max subscription). The container's
# OAuth state lives in a named docker volume (`forge-claude-oauth-v2`),
# populated by `forge auth login`. Container mounts the volume at /home/agent
# so .claude/.credentials.json + .claude.json land where claude CLI expects.
#
# Installed at ~/.forge/runtimes/claude-oauth.yml by install-seeds.sh.

name: claude-oauth
description: |
  Claude via Anthropic OAuth (Claude Pro / Max). Personal-Mac default.
  Supports Opus 4.7 via Claude Pro subscription.

detect:
  # No env signal; this is the fallback runtime when bedrock isn't detected
  # and ANTHROPIC_API_KEY isn't set. The runner's detection logic checks
  # CLAUDE_CODE_USE_BEDROCK + AWS_PROFILE + ANTHROPIC_API_KEY first; if
  # none match, oauth is the default.
  env: []
  files: []

image: agent-dev-worker:latest

models:
  # Personal Claude Pro: Opus 4.7 is available; use it for thinking work.
  # Reds + ambient work use Haiku. Default lands on Sonnet as the middle ground.
  spec-writer: claude-opus-4-7
  fast-orchestrator: claude-haiku-4-5
  default: claude-sonnet-4-6

auth:
  mode: oauth-volume   # bind-mounts the forge-claude-oauth-v2 volume at /home/agent
  # The volume is agent-scoped (not host-scoped); the blast radius of any agent
  # write is the volume itself. Populated by `forge auth login`. See
  # FORGE-DEC-006 (host file mount approach) and #97 (named-volume migration).

env: {}

mounts:
  - host: "${TASK_DIR}"
    container: /task
    mode: rw

  - host: "${PROJECT_DIR}"
    container: /project
    mode: "${PROJECT_MODE:-rw}"

  - host: "${DESIGN_DIR}"
    container: /design
    mode: ro
    optional: true

  - host: "${FORGE_BROWSER_TOOLS_DIR:-~/pi-skills/browser-tools}"
    container: /home/agent/.claude/skills/browser-tools
    mode: ro
    optional: true

invocation:
  command: claude
  args:
    - --model
    - "${MODEL}"
    - --append-system-prompt
    - "${SYSTEM_PROMPT}"
    - --dangerously-skip-permissions
    - --output-format
    - stream-json
    - --verbose
    - --include-partial-messages
    - --print
  stdin: "${TASK_PACKAGE_MARKDOWN}"

container:
  name: "forge-${TASK_ID}"
  remove_on_exit: true
  idle_timeout_seconds: 300

result:
  file: /task/result.json
  stdout_log: container.stdout.log
  stderr_log: container.stderr.log
