name: CI

# job `test` is the required merge-gate check (FG-474): `npm run test:all`
# (unit tier + dashboard workspace) is now the FAST canonical gate (FG-495,
# <=60s target / <=120s ceiling) so the orchestrator/review-loop don't pay
# minutes re-running it on the host as their merge gate — see CLAUDE.md's
# "Merge authorization" section and docs/how-to-testing.md.
#
# job `test-extended` (FG-495) is the required merge check carrying the
# integration + worktree tiers moved out of the fast gate — real
# subprocess/git/DB coverage that's still trust-sensitive. It is now a
# lightweight FINAL AGGREGATE: the slow work is sharded across eight
# concurrent jobs — `integration_1`..`integration_5` (root integration tier,
# FG-624: partitioned by MEASURED per-file duration rather than Node's
# --test-shard, which split by file index and left one shard at 5m25s
# against this 6-minute ceiling while its siblings finished in 2.5 min),
# `worktree` (root worktree tier), `dashboard_integration` (dashboard
# workspace's own integration tier), and `dashboard_browser` (FG-642: the
# dashboard's real-Chrome tier, which until then ran in CI nowhere and
# skipped itself to green everywhere else). `test-extended` `needs` all eight and, with
# `if: always()`, FAILS CLOSED unless every one reports success — so a
# failed/cancelled/skipped shard cannot yield a green required check. Branch
# protection still carries both contexts ("test" and "test-extended"; the
# orchestrator applies that host-side, see CLAUDE.md's branch-protection
# note). It runs on the same triggers as `test`. Since FG-501, review-loop
# verification no longer re-pays either tier per round in the common case:
# on a clean tree it waits for and reuses this in-flight CI run (polling
# both required checks, then reusing the covering evidence) instead of
# duplicating the suite locally — a real local run is only the fallback
# when CI is unavailable, unpaired, or the wait times out (fast tier only;
# `--local-extended` restores the full local tier). See CLAUDE.md's
# "CI vs review-loop verification" section.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node pinned to .nvmrc (24) — the better-sqlite3 NODE_MODULE_VERSION
      # ABI mismatch (137 vs 131) seen with a login-shell nvm default only
      # happens when the running Node version drifts from the version the
      # native module was built for. Pinning removes that class of failure.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Defensive: guarantees better-sqlite3's native binding matches the
      # pinned Node ABI even if a cached/prebuilt binary was restored.
      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Test (root + dashboard workspace)
        run: npm run test:all

  # Root integration tier, sharded 5 ways by MEASURED per-file duration
  # (FG-624): scripts/run-integration-tests.sh bin-packs the discovered files
  # over scripts/integration-timings.json and hands each job an explicit file
  # list. All five run concurrently (no `needs` between them). Five, not four:
  # the balanced 4-way partition fits today (~3m54s projected worst shard) but
  # leaves too little room for the failure this ticket came from — ONE new file
  # landing on the wrong shard. Every shard runs on the .nvmrc interpreter alone
  # (FG-647): the F31 preflight coverage in node-preflight.integration.test.ts is
  # deterministic under one Node, so no shard downloads a second one.
  integration_1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 1/5)
        run: bash scripts/run-integration-tests.sh 1/5

  integration_2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 2/5)
        run: bash scripts/run-integration-tests.sh 2/5

  integration_3:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 3/5)
        run: bash scripts/run-integration-tests.sh 3/5

  integration_4:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 4/5)
        run: bash scripts/run-integration-tests.sh 4/5

  integration_5:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 5/5)
        run: bash scripts/run-integration-tests.sh 5/5

  # Root worktree tier (~23s).
  worktree:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test worktree tier
        run: npm run test:worktree

  # Dashboard workspace's own integration tier (~1.6s).
  dashboard_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test dashboard integration tier
        run: npm run test:integration -w dashboard

  # Dashboard browser tier (FG-642): 5 Playwright-driven suites, 18 tests against
  # a real Chrome. It ran in CI nowhere until this job, and off a Chrome-carrying
  # host it reported green by skipping — which is how it hid a live FG-608 red.
  # The browser is now provisioned explicitly and named to the tier: a runner
  # without one FAILS on the resolver's precondition (src/util/chrome-bin.ts)
  # instead of skipping, so an unprovisioned runner is loud, not silently empty.
  dashboard_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      # Same provisioning the agent image uses (docker/agent-dev-worker.Dockerfile),
      # driven through the pinned playwright-core the tier itself imports — so the
      # browser always matches the client, with no version bump of either.
      - name: Install chromium
        run: npx playwright-core install --with-deps chromium

      # Playwright installs under ~/.cache/ms-playwright, which is not one of the
      # resolver's system locations; FORGE_CHROME_BIN is the override that names it.
      - name: Point the tier at the installed chromium
        run: |
          set -euo pipefail
          bin=$(node -p "require('playwright-core').chromium.executablePath()")
          test -x "$bin"
          echo "FORGE_CHROME_BIN=$bin" >> "$GITHUB_ENV"

      - name: Test dashboard browser tier
        run: npm run test:browser -w dashboard

  # Lightweight FINAL AGGREGATE — the required branch-protection context
  # `CI / test-extended`. It does no test work itself; it fails closed unless
  # every one of the eight sharded/tiered jobs above reports success, so a
  # failed, cancelled, or skipped dependency cannot yield a green required
  # check.
  test-extended:
    runs-on: ubuntu-latest
    needs: [integration_1, integration_2, integration_3, integration_4, integration_5, worktree, dashboard_integration, dashboard_browser]
    if: always()
    steps:
      - name: Aggregate required extended gate
        if: always()
        run: |
          set -euo pipefail
          results="${{ needs.integration_1.result }} ${{ needs.integration_2.result }} ${{ needs.integration_3.result }} ${{ needs.integration_4.result }} ${{ needs.integration_5.result }} ${{ needs.worktree.result }} ${{ needs.dashboard_integration.result }} ${{ needs.dashboard_browser.result }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::extended gate dependency not successful: $r"
              exit 1
            fi
          done
          echo "all eight extended-gate dependencies succeeded"
