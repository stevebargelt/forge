name: CI

# job `test` is the required merge-gate check (FG-474): `npm run test:all`
# (unit tier + dashboard workspace) is now the FAST canonical gate (FG-495,
# <=60s target / <=120s ceiling) so the orchestrator/review-loop don't pay
# minutes re-running it on the host as their merge gate — see CLAUDE.md's
# "Merge authorization" section and docs/how-to-testing.md.
#
# job `test-extended` (FG-495) is the required merge check carrying the
# integration + worktree tiers moved out of the fast gate — real
# subprocess/git/DB coverage that's still trust-sensitive. It is now a
# lightweight FINAL AGGREGATE: the slow work is sharded across THIRTEEN
# concurrent jobs (FG-704) — `integration_1`..`integration_8` (root integration
# BULK tier, FG-624: partitioned by the BATCHED-execution cost of each file —
# MEASURED per-file duration discounted by an estimated per-file `node --test`
# startup, see src/test-shards.ts's packWeight — rather than Node's --test-shard,
# which split by file index and left one shard at 5m25s against this ceiling
# while its siblings finished in 2.5 min; six bulk shards could not meet the
# sub-5min + p95<4:15 target once a single 222s file anchored a shard floor, so
# the bulk tier went to EIGHT), `integration_serial` (FG-681/FG-704: the fg576
# AC9 correlation suite, run ALONE under --test-concurrency=1 in its own
# dedicated lane — it is EXCLUDED from the eight bulk shards so its real 30s
# production window never shares a job with anything else), `worktree` (root
# worktree tier), `dashboard_integration` (dashboard workspace's own integration
# tier), and `dashboard_browser` (FG-642: the dashboard's real-Chrome tier, which
# until then ran in CI nowhere and skipped itself to green everywhere else), and
# `fg693_alias_identity` (FG-693: the FG-693 identity suite re-run with TMPDIR
# pointed at a SYMLINK, so this Linux runner carries the filesystem-alias class
# natively instead of being green on it by accident of platform). `test-extended`
# `needs` all thirteen (derived fail-closed from `toJSON(needs)`) and, with
# `if: always()`, FAILS CLOSED unless every one reports success — so a
# failed/cancelled/skipped shard cannot yield a green required check. Branch
# protection still carries both contexts ("test" and "test-extended"; the
# orchestrator applies that host-side, see CLAUDE.md's branch-protection
# note). It runs on the same triggers as `test`. Since FG-501, review-loop
# verification no longer re-pays either tier per round in the common case:
# on a clean tree it waits for and reuses this in-flight CI run (polling
# both required checks, then reusing the covering evidence) instead of
# duplicating the suite locally — a real local run is only the fallback
# when CI is unavailable, unpaired, or the wait times out (fast tier only;
# `--local-extended` restores the full local tier). See CLAUDE.md's
# "CI vs review-loop verification" section.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node pinned to .nvmrc (24) — the better-sqlite3 NODE_MODULE_VERSION
      # ABI mismatch (137 vs 131) seen with a login-shell nvm default only
      # happens when the running Node version drifts from the version the
      # native module was built for. Pinning removes that class of failure.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Defensive: guarantees better-sqlite3's native binding matches the
      # pinned Node ABI even if a cached/prebuilt binary was restored.
      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Test (root + dashboard workspace)
        run: npm run test:all

  # Root integration BULK tier, sharded 8 ways by BATCHED-execution cost
  # (FG-624/FG-704): scripts/run-integration-tests.sh bin-packs the discovered
  # files — MINUS fg576, which runs alone in `integration_serial` below — over
  # scripts/integration-timings.json and hands each job an explicit file list.
  # The packer balances the BATCHED cost of a shard, not the serial-measure cost:
  # each manifest weight is a single-file `node --test` measure (startup + exec),
  # but a shard runs all its files in ONE batch and pays startup ~once, so
  # src/test-shards.ts discounts an estimated per-file startup before packing
  # (packWeight). All eight run concurrently (no `needs` between them). Eight, not
  # six: CI evidence showed the ~1481s x64 bulk test-time over 6 shards is
  # ~4.1-5.5m worst — a single 222s file (campaign.integration.test.ts) anchors a
  # shard floor — so 6 (and 7) could not meet the sub-5min + p95<4:15 target;
  # over 8 shards the worst is ~3.8m, the headroom that target needs against
  # runtime variance. Every shard runs on the .nvmrc interpreter alone (FG-647):
  # the F31 preflight coverage in node-preflight.integration.test.ts is
  # deterministic under one Node, so no shard downloads a second one.
  #
  # The shards' ceiling is 10 minutes, not the 6 the other extended-gate jobs
  # carry. At cfbebcc5 `integration_1` ran the whole shard GREEN — node:test
  # reported `suites 19, pass 696, fail 0, cancelled 0, skipped 0` in
  # `duration_ms 356585` (5m57s) — and was then killed at the 6-minute ceiling.
  # GitHub renders that as `##[error]The operation was canceled.`, which is NOT a
  # test failure; because `test-extended` is a fail-closed aggregate, the
  # cancelled shard turned a required check red with nothing actually failing.
  # The same shard on `main` took 4m54s (6ed18386) and 5m29s (1807ba1f) — 31 to
  # 66 seconds of headroom against the ceiling, with roughly 35 seconds of
  # observed run-to-run variance between two consecutive green runs: the margin
  # was already smaller than the noise. Nor is the shard estimate at fault —
  # FG-624's bin-packer in src/test-shards.ts already weights an unmeasured file
  # at the p75 of measured files precisely because "the cost of guessing low is a
  # shard that blows the 6-minute ceiling". It guessed high and the shard blew
  # the ceiling anyway. The tier has grown into its budget. Raising the ceiling
  # costs no wall-clock on a healthy run (the shards are concurrent); it only
  # changes how long a genuinely hung job is allowed to hang.
  integration_1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 1/8)
        run: bash scripts/run-integration-tests.sh 1/8

  integration_2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 2/8)
        run: bash scripts/run-integration-tests.sh 2/8

  integration_3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 3/8)
        run: bash scripts/run-integration-tests.sh 3/8

  integration_4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 4/8)
        run: bash scripts/run-integration-tests.sh 4/8

  integration_5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 5/8)
        run: bash scripts/run-integration-tests.sh 5/8

  integration_6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 6/8)
        run: bash scripts/run-integration-tests.sh 6/8

  integration_7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 7/8)
        run: bash scripts/run-integration-tests.sh 7/8

  integration_8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (shard 8/8)
        run: bash scripts/run-integration-tests.sh 8/8

  # The 9th integration job (FG-681/FG-704): the DEDICATED SERIAL LANE. It runs
  # ONLY fg576-codex-adapter.integration.test.ts, alone, under
  # `--test-concurrency=1` (the `serial` mode of run-integration-tests.sh takes
  # no k/N selector). fg576's AC9 correlation tests observe a real 30-second
  # production window and prove correlation at ordinary operating capacity; they
  # must run with nothing else concurrent, not merely in a smaller bucket, or the
  # same scheduling flake is only postponed. It is excluded from the eight bulk
  # shards entirely, so (bulk ∪ serial) is the whole discovered tier, disjoint.
  # It keeps the shards' 10-minute ceiling (the ~62s suite has ample headroom;
  # the ceiling is the hang backstop, deliberately NOT lowered to 5 — FG-704
  # non-goal).
  integration_serial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test integration (serial lane — fg576 alone, concurrency 1)
        run: bash scripts/run-integration-tests.sh serial

  # Root worktree tier (~23s).
  worktree:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test worktree tier
        run: npm run test:worktree

  # Dashboard workspace's own integration tier (~1.6s).
  dashboard_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test dashboard integration tier
        run: npm run test:integration -w dashboard

  # Dashboard browser tier (FG-642): 5 Playwright-driven suites, 18 tests against
  # a real Chrome. It ran in CI nowhere until this job, and off a Chrome-carrying
  # host it reported green by skipping — which is how it hid a live FG-608 red.
  # The browser is now provisioned explicitly and named to the tier: a runner
  # without one FAILS on the resolver's precondition (src/util/chrome-bin.ts)
  # instead of skipping, so an unprovisioned runner is loud, not silently empty.
  dashboard_browser:
    runs-on: ubuntu-latest
    # Was 6, raised to 20 (FG-739): the 6-minute ceiling was cancelling this tier
    # whenever Playwright's Chrome-for-Testing CDN download hung (~6-7m observed),
    # turning the fail-closed `test-extended` aggregate red with nothing actually
    # failing (the browser tests pass 109/109 whenever chromium installs). Raising
    # it costs no wall-clock on a healthy run — the install is bounded/retried and
    # near-instant on a cache hit; the ceiling only bounds a genuinely hung job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      # Resolve the installed playwright-core version so the browser cache key
      # below changes EXACTLY when Playwright upgrades — a newer Playwright pins a
      # newer chromium revision under a new ~/.cache/ms-playwright subdir, so a
      # version-keyed cache never serves a stale browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Cache Playwright's browser download across runs (FG-739). On a hit chromium
      # is already on disk, so the install step below detects it and does NOT
      # re-download — sidestepping the slow Chrome-for-Testing CDN entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Same provisioning the agent image uses (docker/agent-dev-worker.Dockerfile),
      # driven through the pinned playwright-core the tier itself imports — so the
      # browser always matches the client, with no version bump of either. Only
      # chromium (with its OS deps) is installed — not all browsers — to minimize
      # download surface. Each attempt is bounded by `timeout` (a normal download
      # is ~1-2m; a hung one is killed at 5m rather than eating the whole job
      # ceiling) and retried, so a slow-CDN blip retries INSTEAD of the job-level
      # timeout silently cancelling the tier (FG-739). On a cache hit the binary is
      # present and only the (fast) OS deps are ensured. If chromium genuinely
      # cannot be installed after the retries the step FAILS LOUDLY, named as an
      # install/infra failure so it does not read as a test failure and is
      # obviously retriable.
      - name: Install chromium
        timeout-minutes: 18
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "chromium install attempt $attempt/3"
            # `-k 10s` hard-bounds each attempt: a bare `timeout 5m` only SIGTERMs,
            # so an installer that ignores SIGTERM overruns unboundedly and the
            # enclosing step/job timeout can then cancel the step as a bare
            # cancellation BEFORE the loud exit 1 below (FG-739 RF-1). The kill-after
            # grace SIGKILLs the child, so worst-case wall-clock is deterministic:
            # 3x(5m+10s) + 20s + 40s backoff ~= 16m30s, always under the 18m step
            # (and 20m job) ceiling, so the loud exit 1 always wins.
            if timeout -k 10s 5m npx playwright-core install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt failed (exit/timeout); backing off before retry"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::FG-739: chromium could not be installed after 3 bounded attempts. This is a Playwright browser INSTALL/INFRA failure (typically a slow Chrome-for-Testing CDN download), NOT a browser-test failure — the tier is retriable; re-run this job." >&2
          exit 1

      # Playwright installs under ~/.cache/ms-playwright, which is not one of the
      # resolver's system locations; FORGE_CHROME_BIN is the override that names it.
      - name: Point the tier at the installed chromium
        run: |
          set -euo pipefail
          bin=$(node -p "require('playwright-core').chromium.executablePath()")
          test -x "$bin"
          echo "FORGE_CHROME_BIN=$bin" >> "$GITHUB_ENV"

      - name: Test dashboard browser tier
        run: npm run test:browser -w dashboard

  # FG-693 AC9: the synthetic symlink-alias regression. THE REASON THIS JOB
  # EXISTS. Forge's canonical-filesystem-identity defect is a darwin defect and
  # this CI is Linux, and that asymmetry is not incidental — it is why FG-575,
  # FG-576 and FG-253 each shipped green and each left the invariant open, and
  # why FG-253's own new doctor coverage reproduced the defect a third time by
  # comparing `/var/...` against `/private/var/...` as different paths. A green
  # Linux run was never evidence for this class.
  #
  # THE MECHANISM IS NOT AN ALIAS LIST. Enumerating today's macOS aliases is
  # exactly what FG-693 forbids (a list that goes stale and covers nothing else),
  # so this job does not name one. It points TMPDIR at a SYMLINK. Every FG-693
  # fixture is built under `os.tmpdir()`, so on this runner every one of them is
  # reachable by two names — the spelling it was created under and its realpath —
  # and the whole suite executes the native alias condition rather than skipping
  # it. That is generic: it is the same condition an arbitrary symlinked parent
  # produces on any host, and it needs no platform branch in any test.
  #
  # Note this is deliberately a SEPARATE job rather than an env var on the
  # existing shards. The suite must also pass under an unaliased temp root (the
  # shards above already run it), and a regression that only ever ran aliased
  # could hide a fix that works only when the two spellings differ.
  #
  # A green run here still does not close FG-693 on its own: the final candidate
  # is verified on darwin too, with the three FG-591 host integration tests.
  fg693_alias_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      # The alias itself. `alias-root` is the real directory; `alias` is another
      # name for it. Nothing downstream knows or cares which is which — that is
      # the point.
      - name: Point TMPDIR at a symlinked temp root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fg693-alias-root"
          ln -sfn "$RUNNER_TEMP/fg693-alias-root" "$RUNNER_TEMP/fg693-alias"
          test -L "$RUNNER_TEMP/fg693-alias"
          test "$(readlink -f "$RUNNER_TEMP/fg693-alias")" != "$RUNNER_TEMP/fg693-alias"
          echo "TMPDIR=$RUNNER_TEMP/fg693-alias" >> "$GITHUB_ENV"

      # Discovered rather than listed: a new FG-693 file must not have to be
      # remembered here to be covered. `path-identity.test.ts` is named because
      # it is the contract's own file and carries no fg693- prefix. The glob is
      # asserted non-empty so a rename cannot silently reduce this job to a no-op
      # that reports green.
      - name: Test the FG-693 identity suite under the aliased temp root
        run: |
          set -euo pipefail
          files=$(find src -name 'fg693-*.test.ts' -o -name 'path-identity.test.ts' | sort)
          test -n "$files"
          echo "$files"
          node --import tsx --import ./src/test-setup.ts --test $files

      - name: Test the dashboard's identity scoping under the aliased temp root
        working-directory: dashboard
        run: node --import tsx --test src/fg693-scope-identity.integration.test.ts

  # Lightweight FINAL AGGREGATE — the required branch-protection context
  # `CI / test-extended`. It does no test work itself; it fails closed unless
  # every one of the thirteen sharded/tiered jobs above reports success, so a
  # failed, cancelled, or skipped dependency cannot yield a green required
  # check.
  #
  # FG-704: the gate is DERIVED from `${{ toJSON(needs) }}`, not a hand-written
  # `results=` list. A job present in `needs` is therefore automatically in the
  # gating loop — the primary hazard here is a job added to `needs` but forgotten
  # in the aggregate string, and deriving from the context makes that impossible.
  # (node is the runner's ambient interpreter, used only to parse the JSON — this
  # job provisions no second interpreter, cf. FG-647.)
  test-extended:
    runs-on: ubuntu-latest
    needs: [integration_1, integration_2, integration_3, integration_4, integration_5, integration_6, integration_7, integration_8, integration_serial, worktree, dashboard_integration, dashboard_browser, fg693_alias_identity]
    if: always()
    steps:
      - name: Aggregate required extended gate
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "dependency results: $NEEDS_JSON"
          failed=$(NEEDS_JSON="$NEEDS_JSON" node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, v]) => v.result !== "success");
            for (const [name, v] of bad) console.error(`::error::extended gate dependency not successful: ${name} = ${v.result}`);
            process.stdout.write(String(bad.length));
          ')
          if [ "$failed" != "0" ]; then
            echo "extended gate: $failed dependency(ies) did not report success"
            exit 1
          fi
          echo "all extended-gate dependencies succeeded"
