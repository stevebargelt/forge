name: CI

# job `test` is the required merge-gate check (FG-474): `npm run test:all`
# (unit tier + dashboard workspace) is now the FAST canonical gate (FG-495,
# <=60s target / <=120s ceiling) so the orchestrator/review-loop don't pay
# minutes re-running it on the host as their merge gate — see CLAUDE.md's
# "Merge authorization" section and docs/how-to-testing.md.
#
# job `test-extended` (FG-495) is the required merge check carrying the
# integration + worktree tiers moved out of the fast gate — real
# subprocess/git/DB coverage that's still trust-sensitive. It is now a
# lightweight FINAL AGGREGATE: the slow work is sharded across six
# concurrent jobs — `integration_1`..`integration_4` (root integration tier
# partitioned by Node's --test-shard, ~4x speedup), `worktree` (root
# worktree tier), and `dashboard_integration` (dashboard workspace's own
# integration tier). `test-extended` `needs` all six and, with
# `if: always()`, FAILS CLOSED unless every one reports success — so a
# failed/cancelled/skipped shard cannot yield a green required check. Branch
# protection still carries both contexts ("test" and "test-extended"; the
# orchestrator applies that host-side, see CLAUDE.md's branch-protection
# note). It runs on the same triggers as `test`. Since FG-501, review-loop
# verification no longer re-pays either tier per round in the common case:
# on a clean tree it waits for and reuses this in-flight CI run (polling
# both required checks, then reusing the covering evidence) instead of
# duplicating the suite locally — a real local run is only the fallback
# when CI is unavailable, unpaired, or the wait times out (fast tier only;
# `--local-extended` restores the full local tier). See CLAUDE.md's
# "CI vs review-loop verification" section.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node pinned to .nvmrc (24) — the better-sqlite3 NODE_MODULE_VERSION
      # ABI mismatch (137 vs 131) seen with a login-shell nvm default only
      # happens when the running Node version drifts from the version the
      # native module was built for. Pinning removes that class of failure.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Defensive: guarantees better-sqlite3's native binding matches the
      # pinned Node ABI even if a cached/prebuilt binary was restored.
      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Test (root + dashboard workspace)
        run: npm run test:all

  # Root integration tier, sharded 4 ways by Node's --test-shard. All four
  # run concurrently (no `needs` between them). Each is identical to the old
  # test-extended setup, and each provisions the ABI-incompatible Node for the
  # F31 preflight test — --test-shard distributes files deterministically but
  # you cannot predict WHICH shard receives node-preflight.integration.test.ts
  # (which treats FORGE_TEST_MISMATCHED_NODE as a HARD requirement), so ALL
  # four shards must have it available.
  integration_1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      # FG-570 F31: the manifest-mismatch tests fake the expected ABI under one
      # interpreter — they prove the ordering, not that the guard prevents a
      # genuinely-doomed native load. Only a real second Node proves that, so
      # provision one (v26.3.1 = ABI 147, vs .nvmrc's 24 = ABI 137) and name it
      # in the env. The test treats FORGE_TEST_MISMATCHED_NODE as a HARD
      # requirement, so this step is what makes the F31 arm gate rather than
      # skip. The job's active Node stays at 24; only the variable points here.
      - name: Provision an ABI-incompatible Node for the F31 preflight test
        run: |
          set -euo pipefail
          ver=v26.3.1
          dest="$RUNNER_TEMP/node-mismatch"
          mkdir -p "$dest"
          curl -fsSL "https://nodejs.org/dist/$ver/node-$ver-linux-x64.tar.xz" | tar -xJ -C "$dest" --strip-components=1
          abi=$("$dest/bin/node" -p process.versions.modules)
          active=$(node -p process.versions.modules)
          echo "provisioned $ver -> ABI $abi (active Node $(node -v) -> ABI $active)"
          test "$abi" != "$active"
          echo "FORGE_TEST_MISMATCHED_NODE=$dest/bin/node" >> "$GITHUB_ENV"

      - name: Test integration (shard 1/4)
        run: bash scripts/run-integration-tests.sh 1/4

  integration_2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Provision an ABI-incompatible Node for the F31 preflight test
        run: |
          set -euo pipefail
          ver=v26.3.1
          dest="$RUNNER_TEMP/node-mismatch"
          mkdir -p "$dest"
          curl -fsSL "https://nodejs.org/dist/$ver/node-$ver-linux-x64.tar.xz" | tar -xJ -C "$dest" --strip-components=1
          abi=$("$dest/bin/node" -p process.versions.modules)
          active=$(node -p process.versions.modules)
          echo "provisioned $ver -> ABI $abi (active Node $(node -v) -> ABI $active)"
          test "$abi" != "$active"
          echo "FORGE_TEST_MISMATCHED_NODE=$dest/bin/node" >> "$GITHUB_ENV"

      - name: Test integration (shard 2/4)
        run: bash scripts/run-integration-tests.sh 2/4

  integration_3:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Provision an ABI-incompatible Node for the F31 preflight test
        run: |
          set -euo pipefail
          ver=v26.3.1
          dest="$RUNNER_TEMP/node-mismatch"
          mkdir -p "$dest"
          curl -fsSL "https://nodejs.org/dist/$ver/node-$ver-linux-x64.tar.xz" | tar -xJ -C "$dest" --strip-components=1
          abi=$("$dest/bin/node" -p process.versions.modules)
          active=$(node -p process.versions.modules)
          echo "provisioned $ver -> ABI $abi (active Node $(node -v) -> ABI $active)"
          test "$abi" != "$active"
          echo "FORGE_TEST_MISMATCHED_NODE=$dest/bin/node" >> "$GITHUB_ENV"

      - name: Test integration (shard 3/4)
        run: bash scripts/run-integration-tests.sh 3/4

  integration_4:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Provision an ABI-incompatible Node for the F31 preflight test
        run: |
          set -euo pipefail
          ver=v26.3.1
          dest="$RUNNER_TEMP/node-mismatch"
          mkdir -p "$dest"
          curl -fsSL "https://nodejs.org/dist/$ver/node-$ver-linux-x64.tar.xz" | tar -xJ -C "$dest" --strip-components=1
          abi=$("$dest/bin/node" -p process.versions.modules)
          active=$(node -p process.versions.modules)
          echo "provisioned $ver -> ABI $abi (active Node $(node -v) -> ABI $active)"
          test "$abi" != "$active"
          echo "FORGE_TEST_MISMATCHED_NODE=$dest/bin/node" >> "$GITHUB_ENV"

      - name: Test integration (shard 4/4)
        run: bash scripts/run-integration-tests.sh 4/4

  # Root worktree tier (~23s). No F31 step — the F31 test is an integration
  # test, not a worktree test.
  worktree:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test worktree tier
        run: npm run test:worktree

  # Dashboard workspace's own integration tier (~1.6s).
  dashboard_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 native module
        run: npm rebuild better-sqlite3

      - name: Test dashboard integration tier
        run: npm run test:integration -w dashboard

  # Lightweight FINAL AGGREGATE — the required branch-protection context
  # `CI / test-extended`. It does no test work itself; it fails closed unless
  # every one of the six sharded/tiered jobs above reports success, so a
  # failed, cancelled, or skipped dependency cannot yield a green required
  # check.
  test-extended:
    runs-on: ubuntu-latest
    needs: [integration_1, integration_2, integration_3, integration_4, worktree, dashboard_integration]
    if: always()
    steps:
      - name: Aggregate required extended gate
        if: always()
        run: |
          set -euo pipefail
          results="${{ needs.integration_1.result }} ${{ needs.integration_2.result }} ${{ needs.integration_3.result }} ${{ needs.integration_4.result }} ${{ needs.worktree.result }} ${{ needs.dashboard_integration.result }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::extended gate dependency not successful: $r"
              exit 1
            fi
          done
          echo "all six extended-gate dependencies succeeded"
